spring.application.name=GomsBook-AI-API
server.port=5001

management.endpoints.web.exposure.include=health,info,mappings
management.endpoint.health.show-details=always

# ============================================================
# GomsBook AI
# ============================================================
gomsbook.ai.ollama.base-url=http://localhost:11434
gomsbook.ai.ollama.chat-model=gemma4:31b-cloud
gomsbook.ai.ollama.embedding-model=nomic-embed-text

# ============================================================
# GomsBook AI Project ENV
# ============================================================
gomsbook.ai.project-root=C:/1004.GomsBook/03.Project/
gomsbook.ai.publish-directory=C:/1004.GomsBook/02.Publish/
gomsbook.ai.epubcheck.directory=D:/14.EPub/lib/epubcheck-5.3.0
gomsbook.ai.epubcheck.version=5.3.0

# ============================================================
# Database - PostgreSQL
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:gomsbook_ai}
spring.datasource.username=${POSTGRES_USER:gomsbook}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# Flyway
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ============================================================
# GomsBook AI Dictionaries file
# ============================================================
gomsbook.ai.korean-typo-dictionary=C:/1004.GomsBook/03.Project/dictionaries/typo-ko.txt

# =======================================================================================
# GomsBook AI RAG EVALUATION RETRIEVAL MODE. VECTOR_ONLY(V1), VECTOR_GRAPH(V6), HYBRID
# =======================================================================================
gomsbook.ai.rag.evaluation.retrieval-mode=HYBRID
gomsbook.ai.rag.evaluation.version=V6

# ============================================================
# Qdrant
# ============================================================
gomsbook.ai.qdrant.host=${QDRANT_HOST:localhost}
gomsbook.ai.qdrant.grpc-port=${QDRANT_GRPC_PORT:6334}
gomsbook.ai.qdrant.collection-name=${QDRANT_COLLECTION:gomsbook_rag}
gomsbook.ai.qdrant.tls=${QDRANT_TLS:false}

# ============================================================
# RAG Vector Store Benchmark
# ============================================================
gomsbook.ai.rag.benchmark.enabled=true

